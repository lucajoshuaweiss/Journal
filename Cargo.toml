[package]
name = "journal"
authors= ["Luca Joshua Weiß"]
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
